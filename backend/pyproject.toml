[project]
name = "fantasy-football-plinko-backend"
version = "0.1.0"
description = "FastAPI backend for the Fantasy Football Plinko draft assistant"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]",
    "aiosqlite",
    "httpx",
    "python-json-logger",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
    "respx",
    "coverage",
    "pytest-cov",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# B008: FastAPI uses `Depends(...)` and `Body(...)` in route signatures by design.
ignore = ["B008"]

[tool.coverage.run]
source = ["app"]
